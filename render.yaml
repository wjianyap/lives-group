services:
  - type: web
    name: lives-group-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DB
        sync: false
      - key: DB_NAME
        value: lives_mdm
      - key: SECRET
        generateValue: true
